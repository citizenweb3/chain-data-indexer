services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: logos_indexer
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PG_HOST_BIND:-127.0.0.1}:${PG_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logos -d logos_indexer"]
      interval: 5s
      timeout: 5s
      retries: 5

  indexer:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_URL:    ${NODE_URL:-http://host.docker.internal:8080}
      PG_HOST:     postgres
      PG_PORT:     5432
      PG_DB:       logos_indexer
      PG_USER:     logos
      PG_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      FROM_SLOT:   ${FROM_SLOT:-0}
      FOLLOW:      ${FOLLOW:-true}
      BATCH_SIZE:  ${BATCH_SIZE:-500}
      LOG_LEVEL:   ${LOG_LEVEL:-info}
      LOG_FORMAT:  ${LOG_FORMAT:-json}
      API_BIND:    ${API_BIND:-0.0.0.0}
      API_PORT:    ${API_PORT:-3001}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_SAMPLE_INTERVAL_MS: ${METRICS_SAMPLE_INTERVAL_MS:-5000}
    ports:
      - "${API_HOST_BIND:-0.0.0.0}:${API_HOST_PORT:-3001}:${API_PORT:-3001}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${API_PORT:-3001}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
