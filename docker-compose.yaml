services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # Docker's default /dev/shm is 64MB; parallel VACUUM workers and large
    # hash/sort queries allocate shared-memory segments there and fail with
    # "No space left on device". Give Postgres room to breathe.
    shm_size: 1g
    environment:
      POSTGRES_DB: monero_indexer
      POSTGRES_USER: monero
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PG_HOST_BIND:-127.0.0.1}:${PG_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monero -d monero_indexer"]
      interval: 5s
      timeout: 5s
      retries: 5

  indexer:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_URL: ${NODE_URL:-http://host.docker.internal:18089}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: monero_indexer
      PG_USER: monero
      PG_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      FROM_HEIGHT: ${FROM_HEIGHT:-0}
      FOLLOW: ${FOLLOW:-true}
      BATCH_SIZE: ${BATCH_SIZE:-200}
      RPC_CONCURRENCY: ${RPC_CONCURRENCY:-16}
      TX_BATCH_SIZE: ${TX_BATCH_SIZE:-200}
      FOLLOW_POLL_INTERVAL_MS: ${FOLLOW_POLL_INTERVAL_MS:-10000}
      SETTLEMENT_DEPTH: ${SETTLEMENT_DEPTH:-20}
      SUPPLY_ENABLED: ${SUPPLY_ENABLED:-true}
      SUPPLY_CHUNK_SIZE: ${SUPPLY_CHUNK_SIZE:-25000}
      SUPPLY_UPDATE_INTERVAL_MS: ${SUPPLY_UPDATE_INTERVAL_MS:-3600000}
      HEALTH_MAX_LAG_BLOCKS: ${HEALTH_MAX_LAG_BLOCKS:-50}
      HEALTH_MAX_STALL_MS: ${HEALTH_MAX_STALL_MS:-300000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      API_BIND: ${API_BIND:-0.0.0.0}
      API_PORT: ${API_PORT:-3001}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_SAMPLE_INTERVAL_MS: ${METRICS_SAMPLE_INTERVAL_MS:-5000}
    ports:
      - "${API_HOST_BIND:-0.0.0.0}:${API_HOST_PORT:-3001}:${API_PORT:-3001}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${API_PORT:-3001}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
