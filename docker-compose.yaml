services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: miden_indexer
      POSTGRES_USER: miden
      POSTGRES_PASSWORD: ${PG_PASSWORD:-CHANGE_ME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miden -d miden_indexer"]
      interval: 5s
      timeout: 5s
      retries: 5

  miden-indexer:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_URL: ${NODE_URL:-http://host.docker.internal:57291}
      DATABASE_URL: ${DATABASE_URL:-postgresql://miden:CHANGE_ME@postgres:5432/miden_indexer}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: miden_indexer
      PG_USER: miden
      PG_PASSWORD: ${PG_PASSWORD:-CHANGE_ME}
      START_BLOCK: ${START_BLOCK:-0}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INDEXER_HTTP_PORT: ${INDEXER_HTTP_PORT:-3001}
    ports:
      - "${INDEXER_HTTP_HOST_PORT:-3001}:${INDEXER_HTTP_PORT:-3001}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${INDEXER_HTTP_PORT:-3001}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
