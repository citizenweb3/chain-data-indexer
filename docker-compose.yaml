services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-miden_indexer}
    volumes:
      - miden_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  indexer:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_URL: ${NODE_URL:-http://host.docker.internal:57291}
      DATABASE_URL: postgres://${POSTGRES_USER:-miden}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-miden_indexer}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: ${POSTGRES_DB:-miden_indexer}
      PG_USER: ${POSTGRES_USER:-miden}
      PG_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PG_SSL: ${PG_SSL:-disable}
      PG_SSL_CA: ${PG_SSL_CA:-}
      START_BLOCK: ${START_BLOCK:-}
      BATCH_SIZE: ${BATCH_SIZE:-200}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-1500}
      BACKFILL_CONCURRENCY: ${BACKFILL_CONCURRENCY:-16}
      MAX_LAG_BLOCKS_BEFORE_BATCH: ${MAX_LAG_BLOCKS_BEFORE_BATCH:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_SAMPLE_INTERVAL_MS: ${METRICS_SAMPLE_INTERVAL_MS:-5000}
      API_BIND: ${API_BIND:-0.0.0.0}
      API_PORT: ${API_PORT:-8080}
      INDEXER_HTTP_PORT: ${API_PORT:-8080}
    ports:
      - "${API_HOST_BIND:-0.0.0.0}:${API_HOST_PORT:-15080}:${API_PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  adminer:
    image: adminer:4-standalone
    restart: unless-stopped
    profiles: ["debug"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_HOST_BIND:-127.0.0.1}:${ADMINER_HOST_PORT:-15081}:8080"

volumes:
  miden_pgdata:
