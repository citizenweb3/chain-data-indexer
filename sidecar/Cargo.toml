[package]
name        = "miden-decoder"
version     = "0.1.0"
edition     = "2021"
rust-version = "1.90"

[[bin]]
name = "miden-decoder"
path = "src/main.rs"

[dependencies]
miden-protocol = { version = "0.14.4", default-features = false, features = ["std"] }
axum           = { version = "0.8", features = [] }
tokio          = { version = "1", features = ["full"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
hex            = "0.4"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
