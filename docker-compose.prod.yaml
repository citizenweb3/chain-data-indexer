####################################################################
# docker-compose.prod.yaml — Production configuration
# 
# Usage (LOCAL TEST):
#   docker compose -f docker-compose.yaml -f docker-compose.override.yaml \
#                  --env-file .env up --build -d
#
# Usage (PRODUCTION with external DB access):
#   docker compose -f docker-compose.yaml -f docker-compose.override.yaml \
#                  -f docker-compose.prod.yaml --env-file .env.production up --build -d
#
# This file adds production-specific settings:
#   - Exposes PostgreSQL to external connections (for validatorinfo)
#   - PostgreSQL tuning for high-load
#   - Resource limits
#   - Structured logging
####################################################################

services:
  db:
    # Bind to all interfaces for external access
    # IMPORTANT: Secure with firewall rules (allow only validatorinfo server IP)
    #   sudo ufw allow from <VALIDATORINFO_IP> to any port ${PG_PORT:-2432}
    ports:
      - "${PG_EXTERNAL_HOST:-0.0.0.0}:${PG_PORT:-2432}:5432"
    
    # PostgreSQL tuning for HIGH-PERFORMANCE server (320GB RAM)
    # Adjust these values based on your actual server RAM
    command:
      - "postgres"
      # Networking
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "max_connections=500"
      # Memory (tuned for 320GB RAM — allocate ~25% to shared_buffers)
      - "-c"
      - "shared_buffers=64GB"
      - "-c"
      - "effective_cache_size=200GB"
      - "-c"
      - "work_mem=256MB"
      - "-c"
      - "maintenance_work_mem=4GB"
      - "-c"
      - "huge_pages=try"
      # WAL tuning for batch inserts
      - "-c"
      - "wal_buffers=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "max_wal_size=32GB"
      - "-c"
      - "min_wal_size=4GB"
      # Parallel queries
      - "-c"
      - "max_worker_processes=40"
      - "-c"
      - "max_parallel_workers_per_gather=8"
      - "-c"
      - "max_parallel_workers=20"
      - "-c"
      - "max_parallel_maintenance_workers=8"
      # Logging (reduce noise, log slow queries)
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_checkpoints=on"
      # Connection keepalive (for external connections)
      - "-c"
      - "tcp_keepalives_idle=60"
      - "-c"
      - "tcp_keepalives_interval=10"
      - "-c"
      - "tcp_keepalives_count=6"
      # Random page cost (lower for SSD/NVMe)
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
    
    deploy:
      resources:
        limits:
          memory: 200G
        reservations:
          memory: 64G
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"

  indexer:
    deploy:
      resources:
        limits:
          memory: 100G
        reservations:
          memory: 32G
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "20"
