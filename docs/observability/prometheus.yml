# Classic Prometheus scrape alternative for monero-indexer.
# Prefer Grafana Alloy when remote_write and log shipping are both needed.
# Replace placeholder values through your deployment templating system.

global:
  scrape_interval: ${MONERO_INDEXER_SCRAPE_INTERVAL}

scrape_configs:
  - job_name: monero-indexer
    metrics_path: /metrics
    static_configs:
      - targets:
          - ${MONERO_INDEXER_METRICS_TARGET}
